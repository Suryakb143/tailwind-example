<mat-card class="profile-container">
    <!-- Profile Header Section -->
    <mat-card-header class="profile-header">
      <div mat-card-avatar class="profile-avatar">
        <img src="https://via.placeholder.com/150" alt="User Avatar" />
      </div>
      <mat-card-title>John Doe</mat-card-title>
      <mat-card-subtitle>johndoe@example.com</mat-card-subtitle>
    </mat-card-header>
  
    <mat-card-content>
      <p class="bio">Web Developer | JavaScript Enthusiast | Tech Blogger</p>
  
      <!-- Profile Details -->
      <div class="profile-details">
        <h3>Profile Details</h3>
        <mat-list>
          <mat-list-item>
            <strong>Location:</strong> New York, USA
          </mat-list-item>
          <mat-list-item>
            <strong>Joined:</strong> January 2022
          </mat-list-item>
          <mat-list-item>
            <strong>Website:</strong>
            <a href="#">www.johndoe.com</a>
          </mat-list-item>
        </mat-list>
      </div>
    </mat-card-content>
  
    <!-- Profile Action Buttons -->
    <!-- <mat-card-actions>
      <button mat-raised-button color="primary">Edit Profile</button>
      <button mat-raised-button color="accent">Send Message</button>
    </mat-card-actions> -->
  </mat-card>
