<mat-card>
    <mat-card-header>
        <mat-card-title>Authorized Roles</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-list *ngIf="authorizedRoles?.length">
            <mat-list-item *ngFor="let role of authorizedRoles">
                {{ role }}
            </mat-list-item>
        </mat-list>
        <p *ngIf="!authorizedRoles?.length">No roles available.</p>
    </mat-card-content>
</mat-card>

<mat-card>
    <mat-card-header>
        <mat-card-title>Authorized Groups</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-list *ngIf="authorizedGroups?.length">
            <mat-list-item *ngFor="let role of authorizedGroups">
                {{ role }}
            </mat-list-item>
        </mat-list>
        <p *ngIf="!authorizedRoles?.length">No groups available.</p>
    </mat-card-content>
</mat-card>

<h3>Authorized Action Resources Map</h3>

<div *ngFor="let action of authorizedActionResourcesMap">
    <mat-card class="action-resource-card">
        <mat-card-header>
            <mat-card-title>{{ action.resource }}</mat-card-title>
            <mat-card-subtitle>Actions: {{ action.actions.join(', ') }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <strong>Available Actions:</strong>
            <ul>
                <li *ngFor="let act of action.actions">{{ act }}</li>
            </ul>
        </mat-card-content>
    </mat-card>
</div>
